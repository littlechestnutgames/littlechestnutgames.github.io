<!doctype html>
<html lang="en" charset="utf-8">
    <head>
        <title>LLM Interface - Adrien Howard's Portfolio</title>
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-16x16.webp" sizes="16x16">
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-32x32.webp" sizes="32x32">
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-64x64.webp" sizes="64x64">
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-128x128.webp" sizes="128x128">
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-192x192.webp" sizes="192x192">
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-256x256.webp" sizes="256x256">
        <link rel="icon" type="image/webp" href="media/littlechestnutlogo-512x512.webp" sizes="512x512">
        <link rel="stylesheet" href="portfolio.css">
        <script src="llm.js"></script>
    </head>
    <body>
        <header>
            <div>
                <a href="/">
                    <picture>
                        <source media="(max-width: 991px)" srcset="media/littlechestnutlogo-128x128.webp">
                        <source media="(min-width: 992px)" srcset="media/littlechestnutlogo-192x192.webp">
                        <source media="(min-width: 1200px) and (max-width: 1399px)" srcset="media/littlechestnutlogo-256x256.webp">
                        <img src="media/littlechestnutlogo-512x512.webp" alt="LittleChestnut Games Logo">
                    </picture>
                </a>
            </div>
            <h1>LLM Interface</h1>
            <nav>
                <ul>
                    <li>
                        <a href="https://www.github.com/littlechestnutgames/" target="_blank">
                            <img src="media/github-mark.svg" alt="LittleChestnutGames on Github" class="c-invert"></img>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.linkedin.com/in/adrienhoward/" target="_blank">
                            <img src="media/InBug-Black.png" alt="Adrien Howard on LinkedIn" class="c-invert"></img>
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <lcg-llm data-completions="https://www.lumpywizard.net/api/llm/completions" data-models="https://www.lumpywizard.net/api/llm/models"></lcg-llm>
            </section>
        </main>
        <footer>
            <div>
                <a href="/">
                    <picture>
                        <source media="(max-width: 991px)" srcset="media/littlechestnutlogo-128x128.webp">
                        <source media="(min-width: 992px)" srcset="media/littlechestnutlogo-192x192.webp">
                        <source media="(min-width: 1200px) and (max-width: 1399px)" srcset="media/littlechestnutlogo-256x256.webp">
                        <img src="media/littlechestnutlogo-512x512.webp" alt="LittleChestnut Games Logo">
                    </picture>
                </a>
            </div>
            <p>Copyright ©2025 Adrien Howard</p>
        </footer>
    </body>
</html>
